[package]
name = "api-tools"
version = "0.11.1"
authors = ["Fabien Bellanger <valentil@gmail.com>"]
description = "An API tools library for Rust"
edition = "2024"
rust-version = "1.95"
keywords = ["API", "Axum", "Layer", "Metrics", "Tools"]
categories = ["web-programming::http-server"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/api-tools"
repository = "https://github.com/fabienbellanger/api-tools"

[features]
axum = [
    "dep:axum",
    "dep:bytes",
    "dep:bytesize",
    "dep:futures",
    "dep:http-auth-basic",
    "dep:hyper",
    "dep:jsonwebtoken",
    "dep:mime",
    "dep:opentelemetry",
    "dep:serde_json",
    "dep:serde_urlencoded",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:uuid",
]
default = []
full = ["axum", "prometheus"]
# The Prometheus layer and handler live under `server::axum`
prometheus = ["axum", "dep:metrics", "dep:metrics-exporter-prometheus", "dep:sysinfo"]

[dependencies]

# Errors
thiserror = "2.0.21"

# API Server
axum = { version = "0.8.9", optional = true }
http-auth-basic = { version = "0.3.7", optional = true }
hyper = { version = "1.13.0", optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.7.1", features = ["cors", "request-id", "limit"], optional = true }

# Logs
tracing = { version = "0.1.44", optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
opentelemetry = { version = "0.33.1", optional = true }

# Serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }

# Metrics
metrics = { version = "0.24.6", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", optional = true }
sysinfo = { version = "0.40.4", optional = true }

bytes = { version = "1.12.2", optional = true }
bytesize = { version = "2.7.0", optional = true }
jiff = { version = "1.0.3", features = ["serde", "static"] }
futures = { version = "0.3.34", optional = true }
mime = { version = "0.3.18", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
uuid = { version = "1.29.3", features = ["v4", "serde"], optional = true }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"], optional = true }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "registry",
    "std",
] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Groups (priority = -1 so individual lints below can override them)
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hand-picked `restriction` lints
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"

# Pedantic / nursery / cargo exceptions
module_name_repetitions = "allow"
multiple_crate_versions = "allow"   # transitive duplicates are out of our control
option_if_let_else = "allow"        # `map_or_else` rewrites are less readable than `match`
unused_async_trait_impl = "allow"   # `async fn` is the idiomatic form for axum's `FromRequestParts`
